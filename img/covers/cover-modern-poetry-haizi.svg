    <path d="M0 92c130-88 250-102 360-42" stroke-opacity="0.24" stroke-width="10" filter="url(#soft)"/>
    <path d="M0 92c130-88 250-102 360-42" stroke-opacity="0.7" stroke-width="4"/>
    <path d="M64 166c118-72 238-82 356-18" stroke-opacity="0.55" stroke-width="4"/>
    <path d="M36 238c142-60 274-56 394 12" stroke-opacity="0.38" stroke-width="4"/>
