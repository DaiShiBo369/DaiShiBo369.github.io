  <g font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Arial,sans-serif" fill="#ffffff">
    <text x="112" y="140" font-size="30" opacity="0.78">DISBOUNDIA</text>
    <rect x="112" y="184" width="218" height="48" rx="24" fill="#fbbf24" fill-opacity="0.18" stroke="#fde68a" stroke-opacity="0.48"/>
    <text x="136" y="217" font-size="24" fill="#fef3c7">文学 / 支教</text>
    <text x="112" y="340" font-size="86" font-weight="800">走近海子</text>
    <text x="116" y="432" font-size="40" font-weight="600" fill="#e0f2fe">远方、草原与太阳</text>
    <text x="116" y="512" font-size="30" fill="#dbeafe">从三首诗进入现代诗的声音和情绪</text>
    <text x="116" y="790" font-size="26" fill="#fef3c7">2026-07-16</text>
