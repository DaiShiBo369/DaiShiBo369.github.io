<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Qt Widgets quickstart cover</title>
  <desc id="desc">A Qt Widgets article cover showing a desktop window, signal-slot arrows, and layout panels.</desc>
  <defs>
