<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StarRingDefense WebAssembly</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1f2937;
      --muted: #667085;
      --line: #d7dee8;
      --paper: #f8fafc;
      --accent: #2f7665;
      --warn: #9a6a14;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(720px, calc(100vw - 32px));
      padding: 32px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 14px;
      color: var(--warn);
      font-size: 14px;
      font-weight: 700;
    }

    .status::before {
      width: 9px;
      height: 9px;
      content: "";
      border-radius: 50%;
      background: #d8941f;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 5vw, 42px);
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.8;
    }

    code {
      color: var(--accent);
      font-family: "SFMono-Regular", Consolas, monospace;
    }
  </style>
</head>
<body>
  <main>
    <p class="status">WebAssembly 迁移中</p>
    <h1>StarRingDefense</h1>
    <p>当前静态入口已预留给 Qt WebAssembly 产物。现在本机缺少 Emscripten 工具链，暂未生成可嵌入浏览器的 <code>.wasm</code> 版本。</p>
  </main>
</body>
</html>
